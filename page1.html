<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>შავნაბადა — დამატებითი ინფორმაცია</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #173b6c;
            text-align: center;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #173b6c;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>შავნაბადა</h1>

        <p>
            კეთილი იყოს თქვენი მობრძანება დამატებით საინფორმაციო გვერდზე.
        </p>

        <p>
            აქ შეგვიძლია განვათავსოთ ნებისმიერი ინფორმაცია,
            ფოტოები, ვიდეოები, ტექსტები ან სხვა მასალა.
        </p>

        <a class="back" href="index.html">
            ← მთავარ გვერდზე დაბრუნება
        </a>

    </div>
</div>

</body>
</html>
