
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>პერიოდულობის ცხრილი</title>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            background:
                radial-gradient(circle at 10% 15%, #f7dce0 0, transparent 28%),
                radial-gradient(circle at 90% 85%, #f3d5d9 0, transparent 30%),
                linear-gradient(135deg, #fffaf5, #f9eeee, #fff8f2);
            color: #681b2b;
            position: relative;
        }

        /* დეკორატიული ელემენტები */

        .decoration {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.16;
            color: #9c3348;
            font-weight: bold;
        }

        .element-one {
            top: 9%;
            left: 5%;
            font-size: 65px;
            transform: rotate(-12deg);
        }

        .element-two {
            bottom: 10%;
            right: 6%;
            font-size: 75px;
            transform: rotate(10deg);
        }

        .element-three {
            top: 15%;
            right: 10%;
            font-size: 45px;
        }

        .element-four {
            bottom: 13%;
            left: 10%;
            font-size: 48px;
        }

        .main {
            width: min(90%, 850px);
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 35px 0;
            animation: appear 1.1s ease-out;
        }

        .top-label {
            display: inline-block;
            padding: 10px 24px;
            border: 1px solid #d9a8b0;
            border-radius: 30px;
            color: #914052;
            background: rgba(255,255,255,0.65);
            font-size: 13px;
            letter-spacing: 3px;
            margin-bottom: 28px;
        }

        .bubble {
            position: relative;
            padding: 55px 35px 45px;
            background: rgba(255,255,255,0.75);
            border: 2px solid #e6c2c7;
            border-radius: 35px;
            box-shadow:
                0 18px 45px rgba(112, 35, 53, 0.12),
                inset 0 0 25px rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
        }

        .atom {
            width: 95px;
            height: 95px;
            margin: 0 auto 20px;
        }

        .atom svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .school-name {
            font-size: clamp(34px, 6vw, 65px);
            line-height: 1.25;
            font-weight: 900;
            color: #791e32;
            text-shadow: 0 3px 0 #f0d4d8;
        }

        .line {
            width: 130px;
            height: 3px;
            border-radius: 5px;
            background: #b65b6d;
            margin: 25px auto;
        }

        .subtitle {
            color: #89505b;
            font-size: clamp(16px, 2.5vw, 21px);
            line-height: 1.7;
            max-width: 600px;
            margin: auto;
        }

        .scan-button {
            margin-top: 35px;
            padding: 19px 42px;
            font-size: 21px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #a83b53, #791d34);
            border: 2px solid #d28b99;
            border-radius: 50px;
            cursor: pointer;
            box-shadow:
                0 7px 0 #641629,
                0 13px 25px rgba(115, 25, 48, 0.2);
            transition: 0.25s;
        }

        .scan-button:hover {
            transform: translateY(-4px);
            box-shadow:
                0 10px 0 #641629,
                0 18px 28px rgba(115, 25, 48, 0.22);
        }

        .scan-button:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #641629;
        }

        .bottom-text {
            margin-top: 35px;
            color: #a76a76;
            font-size: 13px;
            letter-spacing: 5px;
            font-weight: bold;
        }

        /* QR სკანერის ფანჯარა */

        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(65, 24, 35, 0.48);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        #scanner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(92%, 480px);
            max-height: 90vh;
            overflow-y: auto;
            background: #fffaf7;
            padding: 25px;
            border: 2px solid #e6c2c7;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(60, 15, 30, 0.3);
            z-index: 11;
            text-align: center;
        }

        #scanner h2 {
            color: #791e32;
            font-size: 23px;
            margin-top: 5px;
        }

        #reader {
            width: 100%;
            overflow: hidden;
            border-radius: 15px;
        }

        .close-button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            border-radius: 15px;
            background: #8e2940;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-button:hover {
            background: #a83b53;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .main {
                width: 92%;
            }

            .bubble {
                padding: 35px 20px;
                border-radius: 27px;
            }

            .atom {
                width: 75px;
                height: 75px;
            }

            .scan-button {
                font-size: 18px;
                padding: 16px 27px;
            }

            .bottom-text {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .element-one {
                font-size: 40px;
            }

            .element-two {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- დეკორატიული ქიმიური ელემენტები -->

    <div class="decoration element-one">H</div>
    <div class="decoration element-two">Be</div>
    <div class="decoration element-three">Li</div>
    <div class="decoration element-four">B</div>

    <main class="main">

        <div class="top-label">
            CHEMISTRY • SCIENCE • DISCOVERY
        </div>

        <div class="bubble">

            <div class="atom">
                <svg viewBox="0 0 100 100" fill="none">
                    <ellipse cx="50" cy="50" rx="42" ry="17"
                        stroke="#9c3348" stroke-width="2.5"
                        transform="rotate(45 50 50)"/>
                    <ellipse cx="50" cy="50" rx="42" ry="17"
                        stroke="#9c3348" stroke-width="2.5"
                        transform="rotate(-45 50 50)"/>
                    <ellipse cx="50" cy="50" rx="42" ry="17"
                        stroke="#9c3348" stroke-width="2.5"/>
                    <circle cx="50" cy="50" r="7" fill="#9c3348"/>
                    <circle cx="20" cy="50" r="4" fill="#bd6476"/>
                    <circle cx="78" cy="28" r="4" fill="#bd6476"/>
                </svg>
            </div>

            <div class="school-name">
                პერიოდულობის ცხრილი
            </div>

            <div class="line"></div>

            <p class="subtitle">
                აღმოაჩინე ქიმიური ელემენტების სამყარო
                და გაეცანი მათ საინტერესო ისტორიას.
            </p>

        </div>

        <button class="scan-button" onclick="openScanner()">
            📷 დაასკანერე QR კოდი
        </button>

        <div class="bottom-text">
            EXPLORE &nbsp; • &nbsp; DISCOVER &nbsp; • &nbsp; LEARN
        </div>

    </main>

    <!-- QR სკანერის ფანჯარა -->

    <div id="overlay" onclick="closeScanner()"></div>

    <div id="scanner">

        <h2>📷 QR კოდის სკანირება</h2>

        <div id="reader"></div>

        <button class="close-button" onclick="closeScanner()">
            დახურვა
        </button>

    </div>

    <script>
        let qrScanner = null;
        let isOpening = false;
        let isClosing = false;
        let hasScanned = false;

        async function openScanner() {
            if (isOpening || qrScanner) return;

            isOpening = true;
            hasScanned = false;

            document.getElementById("overlay").style.display = "block";
            document.getElementById("scanner").style.display = "block";

            try {
                qrScanner = new Html5Qrcode("reader");

                await qrScanner.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: { width: 250, height: 250 }
                    },
                    async function(decodedText) {
                        if (hasScanned) return;
                        hasScanned = true;

                        try {
                            const destination = new URL(
                                decodedText,
                                window.location.href
                            );

                            if (
                                destination.protocol !== "https:" &&
                                destination.protocol !== "http:"
                            ) {
                                throw new Error("არასწორი ბმული");
                            }

                            await stopScanner();
                            window.location.href = destination.href;

                        } catch (error) {
                            hasScanned = false;
                            alert("QR კოდში სწორი ბმული ვერ მოიძებნა.");
                        }
                    },
                    function(errorMessage) {
                        // QR კოდის ძებნა გრძელდება
                    }
                );

            } catch (error) {
                alert("კამერის გახსნა ვერ მოხერხდა. შეამოწმე კამერის ნებართვა.");

                await stopScanner();
            } finally {
                isOpening = false;
            }
        }

        async function stopScanner() {
            if (!qrScanner) return;

            const scanner = qrScanner;
            qrScanner = null;

            try {
                if (scanner.isScanning) {
                    await scanner.stop();
                }
            } catch (error) {
                console.log("Scanner stop:", error);
            }

            try {
                scanner.clear();
            } catch (error) {
                console.log("Scanner clear:", error);
            }

            document.getElementById("reader").innerHTML = "";
        }

        async function closeScanner() {
            if (isClosing) return;

            isClosing = true;

            await stopScanner();

            document.getElementById("scanner").style.display = "none";
            document.getElementById("overlay").style.display = "none";

            isClosing = false;
        }
    </script>

</body>
</html>
